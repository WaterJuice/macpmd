[tool.hatch.build]
# Include _version.py in builds even though it's gitignored (generated at build time)
artifacts = ["macpmd/_version.py"]

[tool.hatch.build.targets.wheel]
packages = ["macpmd"]

[project]
name = "macpmd"
requires-python = ">=3.12"
dynamic = ["version"]
license = "Unlicense"
authors = [
    { name = "WaterJuice" },
]
description = "Process manager — a PM2 equivalent using launchd/systemd for persistence"
readme = "ReadMe.md"
keywords = ["process-manager", "macos", "linux", "launchd", "systemd", "pm2", "daemon", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
]

[project.urls]
Documentation = "https://docs.waterjuice.org/macpmd/latest/"
Source = "https://github.com/WaterJuice/macpmd"

[project.scripts]
macpmd = "macpmd.cli:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
pattern = "default-unprefixed"

[tool.uv]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["F", "E", "W", "I", "Q", "B", "TC", "UP"]
ignore = ["E501", "B009", "B010", "UP007", "UP036", "TC001", "TC003"]

[tool.ruff.lint.isort]
no-lines-before = ["future","standard-library","third-party","first-party","local-folder"]
force-single-line = true

[tool.pyright]
typeCheckingMode = "strict"
reportUnusedImport = "error"
pythonVersion = "3.12"
exclude = [".venv"]

[tool.wj-publish]
profile = "waterjuice"

[dependency-groups]
dev = [
    "ruff",
    "black",
    "pyright[nodejs]",
    "wj-mkdocs ; python_version >= '3.12'",
    "wj-publish ; python_version >= '3.12'",
]
